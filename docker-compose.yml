# Runs the whole portal locally in Docker: database, migrator, API and web app. See docs/docker.md.
#
#   web app   http://localhost:8080
#   API       https://localhost:8443   (sign-in pages, Swagger at /swagger)
#   database  localhost:5433           (5432 is left to the Postgres already installed on this machine)
#   mailbox   http://localhost:5000    (smtp4dev: every email the portal sends lands here, nothing leaves the machine)

name: dixels-portal

x-connection-string: &connection-string "Host=db;Port=5432;Database=DixelsPortal;User ID=postgres;Password=docker-local-only;"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker-local-only
      POSTGRES_DB: DixelsPortal
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d DixelsPortal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once on every `up`: applies migrations and seeds the admin user, permissions and sign-in clients, then exits.
  migrator:
    build:
      context: ./backend
      target: migrator
    environment:
      ConnectionStrings__Default: *connection-string
      OpenIddict__Applications__Portal_Swagger__RootUrl: https://localhost:8443
      OpenIddict__Applications__Portal_App__RootUrl: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: web
      args:
        CERT_PASSPHRASE: &cert-passphrase docker-local-only
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AuthServer__CertificatePassPhrase: *cert-passphrase
      ASPNETCORE_URLS: https://+:8443
      # HTTPS uses this machine's ASP.NET Core development certificate, exported to docker/certs (see docs/docker.md),
      # so the browser trusts https://localhost:8443 the same way it trusts https://localhost:44393.
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/localhost.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${DEV_CERT_PASSWORD:-dixels-dev}
      App__SelfUrl: https://localhost:8443
      App__ClientUrl: http://localhost:8080
      App__CorsOrigins: http://localhost:8080
      ConnectionStrings__Default: *connection-string
      # ABP's own mail settings: email goes to smtp4dev instead of Microsoft 365 (plain SMTP; UseDefaultCredentials
      # stays at ABP's default "true", so no sign-in). The real server's settings: docs/DEPLOYMENT.md.
      Settings__Abp.Mailing.Smtp.Host: smtp4dev
      Settings__Abp.Mailing.Smtp.Port: "25"
      Settings__Abp.Mailing.Smtp.EnableSsl: "false"
      Settings__Abp.Mailing.DefaultFromAddress: noreply@dixels.local
      Settings__Abp.Mailing.DefaultFromDisplayName: Dixels Portal
    ports:
      - "8443:8443"
    volumes:
      - ./docker/certs:/https:ro
      - api-keys:/app/App_Data/DataProtection-Keys
    depends_on:
      migrator:
        condition: service_completed_successfully
      smtp4dev:
        condition: service_started

  # A fake mailbox: accepts any email on SMTP port 25 (inside Docker) and shows it at http://localhost:5000.
  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - "5000:80"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://localhost:8443
        VITE_BASE: /
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
  api-keys:
